<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpawnByte DL - YouTube Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span class="logo-text">SpawnByte<span class="logo-accent">DL</span></span>
            </div>
            <a href="https://github.com/spawnbyte/spawnbyte-dl" target="_blank" class="github-link">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
            </a>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- URL Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="text" id="url-input" class="url-input" placeholder="Paste YouTube URL here...">
                    <button id="fetch-btn" class="fetch-btn">
                        <span class="fetch-text">Fetch</span>
                        <div class="fetch-loader"></div>
                    </button>
                </div>
            </div>

            <!-- Video Info Card (hidden initially) -->
            <div id="video-card" class="video-card hidden">
                <div class="video-thumbnail-wrapper">
                    <img id="video-thumbnail" class="video-thumbnail" src="" alt="Thumbnail">
                    <span id="video-duration" class="video-duration"></span>
                </div>
                <div class="video-info">
                    <h2 id="video-title" class="video-title"></h2>
                    <p id="video-channel" class="video-channel"></p>
                </div>
            </div>

            <!-- Options Card (hidden initially) -->
            <div id="options-card" class="options-card hidden">
                <!-- Download Type Toggle -->
                <div class="option-group">
                    <label class="option-label">Download Type</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-type="video">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
                                <line x1="7" y1="2" x2="7" y2="22"/>
                                <line x1="17" y1="2" x2="17" y2="22"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <line x1="2" y1="7" x2="7" y2="7"/>
                                <line x1="2" y1="17" x2="7" y2="17"/>
                                <line x1="17" y1="17" x2="22" y2="17"/>
                                <line x1="17" y1="7" x2="22" y2="7"/>
                            </svg>
                            Video
                        </button>
                        <button class="toggle-btn" data-type="audio">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                            Audio
                        </button>
                    </div>
                </div>

                <!-- Quality Selection -->
                <div class="option-group">
                    <label class="option-label">Quality</label>
                    <div class="select-wrapper">
                        <select id="quality-select" class="quality-select">
                            <!-- Populated dynamically -->
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                </div>

                <!-- Time Trimming -->
                <div class="option-group">
                    <label class="option-label">
                        Time Range
                        <span class="option-hint">(optional)</span>
                    </label>
                    <div class="time-inputs">
                        <div class="time-input-wrapper">
                            <input type="text" id="start-time" class="time-input" placeholder="0:00">
                            <span class="time-label">Start</span>
                        </div>
                        <span class="time-separator">to</span>
                        <div class="time-input-wrapper">
                            <input type="text" id="end-time" class="time-input" placeholder="End">
                            <span class="time-label">End</span>
                        </div>
                    </div>
                </div>

                <!-- Download Button -->
                <button id="download-btn" class="download-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
            </div>

            <!-- Progress Card (hidden initially) -->
            <div id="progress-card" class="progress-card hidden">
                <div class="progress-header">
                    <span id="progress-status" class="progress-status">Preparing download...</span>
                    <span id="progress-percent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <!-- Complete Card (hidden initially) -->
            <div id="complete-card" class="complete-card hidden">
                <div class="complete-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <h3 class="complete-title">Download Complete!</h3>
                <a id="download-link" class="download-link" href="" download>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Save File
                </a>
                <button id="new-download-btn" class="new-download-btn">Download Another</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with <span class="heart">&#10084;</span> by <a href="https://spawnbyte.com" target="_blank">SpawnByte LLC</a></p>
            <p class="footer-note">Open Source | Requires yt-dlp & ffmpeg</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
